services:
  # 1. MariaDB Database (WordPress & Flarum)
  db:
    image: mariadb:10.11
    container_name: drf_db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: drf_root_secret
      MYSQL_DATABASE: wordpress
      MYSQL_USER: drf_user
      MYSQL_PASSWORD: drf_pass_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. WordPress 6.7 Container
  wordpress:
    image: wordpress:6.7-apache
    container_name: drf_wordpress
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: drf_user
      WORDPRESS_DB_PASSWORD: drf_pass_secret
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_core:/var/www/html
      - ./wordpress/wp-content/themes/drf-augenblicke:/var/www/html/wp-content/themes/drf-augenblicke
      - ./wordpress/wp-content/plugins/drf-flarum-bridge:/var/www/html/wp-content/plugins/drf-flarum-bridge

  # 3. Flarum Community Forum Container
  flarum:
    build:
      context: ./flarum
      dockerfile: Dockerfile
    container_name: drf_flarum
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: flarum
      DB_USER: drf_user
      DB_PASSWORD: drf_pass_secret
    volumes:
      - flarum_data:/var/www/html
      - ./flarum/custom-assets:/custom-assets:ro

  # 4. Nginx Reverse Proxy (Routes / to WordPress and /forum/ to Flarum)
  nginx:
    image: nginx:alpine
    container_name: drf_reverse_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - wordpress
      - flarum
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # 5. WP-CLI Helper for Automated One-Click Setup
  wpcli:
    image: wordpress:cli
    container_name: drf_wpcli
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    volumes:
      - wp_core:/var/www/html
      - ./wordpress/wp-content/themes/drf-augenblicke:/var/www/html/wp-content/themes/drf-augenblicke
      - ./wordpress/wp-content/plugins/drf-flarum-bridge:/var/www/html/wp-content/plugins/drf-flarum-bridge
      - ./scripts:/scripts
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_core:
  flarum_data:
